name: PR route enforcement

on:
  workflow_run:
    workflows: ['PR policy']
    types: [completed]

# This workflow always uses trusted default-branch code, never PR code or artifacts.
permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-route-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {publishRoutes} = require('./.github/scripts/pr-route.cjs');
            await publishRoutes({github, context, core});
