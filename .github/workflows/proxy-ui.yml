name: Proxy UI
on:
  pull_request:
    paths: ['web/static/js/test-proxy.js', 'web/static/css/style.css', 'web/static/js/settings.js', 'web/templates/index.html', 'tests/browser/test-proxy.cjs', 'tests/browser/chat-reading.cjs', 'web/static/css/chat-history.css', '.github/workflows/proxy-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser fixture dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/proxy-browser" --ignore-scripts --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/proxy-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Frontend and proxy batch regression
        env:
          NODE_PATH: ${{ runner.temp }}/proxy-browser/node_modules
          TEST_PROXY_SCREENSHOTS: ${{ runner.temp }}/proxy-screenshots
        run: |
          node --test tests/web/*.test.cjs tests/web/*.test.mjs web/static/js/*.test.cjs
          node tests/browser/test-proxy.cjs
          node tests/browser/chat-reading.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-ui-screenshots
          path: ${{ runner.temp }}/proxy-screenshots
          retention-days: 7
